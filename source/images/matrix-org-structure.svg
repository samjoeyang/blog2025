<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>矩阵式组织结构示意图</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    max-width: 820px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 20px; font-weight: 650; fill: var(--fg); }
  .subtitle { font-size: 13px; fill: var(--muted); }
  .label { font-size: 13px; font-weight: 600; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .edge-solid { stroke: #3b82f6; stroke-width: 2; fill: none; }
  .edge-dashed { stroke: #8b5cf6; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.6; }
  .dim-label { font-size: 13px; font-weight: 700; }
</style>
<main>
  <svg viewBox="0 0 780 480">
    <!-- Title -->
    <text x="390" y="36" text-anchor="middle" class="title">矩阵式组织结构示意图</text>

    <!-- Zone: 项目管理维度 -->
    <rect x="205" y="50" width="555" height="54" rx="6" class="zone" />
    <text x="480" y="80" text-anchor="middle" class="dim-label" fill="#8b5cf6">▸ 项目管理维度（虚线汇报）</text>

    <!-- Project Manager boxes -->
    <rect x="280" y="104" width="160" height="38" rx="6" class="node external" />
    <text x="360" y="128" text-anchor="middle" class="label">项目Alpha经理</text>

    <rect x="530" y="104" width="160" height="38" rx="6" class="node external" />
    <text x="610" y="128" text-anchor="middle" class="label">项目Beta经理</text>

    <!-- Zone: 职能管理维度 -->
    <rect x="30" y="50" width="170" height="396" rx="6" class="zone" />
    <text x="115" y="80" text-anchor="middle" class="dim-label" fill="#3b82f6">▸ 职能管理维度</text>
    <text x="115" y="97" text-anchor="middle" class="small">（实线汇报）</text>

    <!-- Functional Manager boxes -->
    <rect x="55" y="115" width="120" height="40" rx="6" class="node input" />
    <text x="115" y="140" text-anchor="middle" class="label">研发总监</text>

    <rect x="55" y="225" width="120" height="40" rx="6" class="node input" />
    <text x="115" y="250" text-anchor="middle" class="label">市场总监</text>

    <rect x="55" y="335" width="120" height="40" rx="6" class="node input" />
    <text x="115" y="360" text-anchor="middle" class="label">销售总监</text>

    <!-- Employee boxes - Row 1 (R&D) -->
    <rect x="280" y="190" width="160" height="40" rx="6" class="node process" />
    <text x="360" y="208" text-anchor="middle" class="label">研发工程师 · 小王</text>
    <text x="360" y="222" text-anchor="middle" class="small">隶属研发部 · 支援项目Alpha</text>

    <rect x="530" y="190" width="160" height="40" rx="6" class="node process" />
    <text x="610" y="208" text-anchor="middle" class="label">研发工程师 · 小李</text>
    <text x="610" y="222" text-anchor="middle" class="small">隶属研发部 · 支援项目Beta</text>

    <!-- Employee boxes - Row 2 (Marketing) -->
    <rect x="280" y="298" width="160" height="40" rx="6" class="node process" />
    <text x="360" y="316" text-anchor="middle" class="label">市场专员 · 小张</text>
    <text x="360" y="330" text-anchor="middle" class="small">隶属市场部 · 支援项目Alpha</text>

    <rect x="530" y="298" width="160" height="40" rx="6" class="node process" />
    <text x="610" y="316" text-anchor="middle" class="label">市场专员 · 小赵</text>
    <text x="610" y="330" text-anchor="middle" class="small">隶属市场部 · 支援项目Beta</text>

    <!-- Employee boxes - Row 3 (Sales) -->
    <rect x="280" y="406" width="160" height="40" rx="6" class="node process" />
    <text x="360" y="424" text-anchor="middle" class="label">销售代表 · 小刘</text>
    <text x="360" y="438" text-anchor="middle" class="small">隶属销售部 · 支援项目Alpha</text>

    <rect x="530" y="406" width="160" height="40" rx="6" class="node process" />
    <text x="610" y="424" text-anchor="middle" class="label">销售代表 · 小陈</text>
    <text x="610" y="438" text-anchor="middle" class="small">隶属销售部 · 支援项目Beta</text>

    <!-- Vertical lines (functional reporting - solid blue): Functional Manager -> Employees -->
    <!-- 研发总监 -->    <path d="M175 135 L280 210" class="edge-solid" />  <path d="M175 135 L530 210" class="edge-solid" />
    <!-- 市场总监 -->    <path d="M175 245 L280 318" class="edge-solid" />  <path d="M175 245 L530 318" class="edge-solid" />
    <!-- 销售总监 -->    <path d="M175 355 L280 426" class="edge-solid" />  <path d="M175 355 L530 426" class="edge-solid" />

    <!-- Horizontal lines (project reporting - dashed purple): Project Manager -> Employees -->
    <!-- 项目Alpha -> 小王 --> <path d="M310 142 L360 190" class="edge-dashed" />
    <!-- 项目Alpha -> 小张 --> <path d="M310 142 L360 298" class="edge-dashed" />
    <!-- 项目Alpha -> 小刘 --> <path d="M310 142 L360 406" class="edge-dashed" />
    <!-- 项目Beta -> 小李 -->  <path d="M580 142 L610 190" class="edge-dashed" />
    <!-- 项目Beta -> 小赵 -->  <path d="M580 142 L610 298" class="edge-dashed" />
    <!-- 项目Beta -> 小陈 -->  <path d="M580 142 L610 406" class="edge-dashed" />

    <!-- Legend -->
    <rect x="30" y="462" width="720" height="2" class="edge" opacity="0.3" />
    <line x1="40" y1="472" x2="90" y2="472" class="edge-solid" />
    <text x="100" y="477" class="small">实线 = 职能汇报（管晋升、薪资、专业成长）</text>
    <line x1="320" y1="472" x2="370" y2="472" class="edge-dashed" />
    <text x="380" y="477" class="small">虚线 = 项目汇报（管日常任务、项目交付）</text>
  </svg>
</main>
