<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520">
  <style>
    .label { font: 600 13px/1.3 ui-sans-serif,system-ui,sans-serif; fill: var(--fg, #172033); }
    .small { font: 11px/1.3 ui-sans-serif,system-ui,sans-serif; fill: var(--muted, #5b6475); }
    .title { font: 700 16px/1.3 ui-sans-serif,system-ui,sans-serif; fill: var(--fg, #172033); }
    .subtitle { font: 12px/1.3 ui-sans-serif,system-ui,sans-serif; fill: var(--muted, #5b6475); }
    .cycle-ring { fill: none; stroke: var(--line, #64748b); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .cycle-node { stroke: var(--line, #64748b); stroke-width: 1.5; }
    .cycle-node.process { fill: var(--process, #c7d2fe); }
    .cycle-node.input { fill: var(--input, #bfdbfe); }
    .cycle-node.neutral { fill: var(--neutral, #e2e8f0); }
    .cycle-node.storage { fill: var(--storage, #99f6e4); }
    .cycle-label { fill: var(--muted, #5b6475); }
    .cycle-center { font-size: 14px; }
  </style>
  <text x="300" y="28" text-anchor="middle" class="title">第80问：塔克曼模型：形成、震荡、规范、成熟四阶段如何应用…</text>
  
  <circle cx="300" cy="260" r="180" class="cycle-ring"/>
  <circle cx="300" cy="260" r="60" class="cycle-ring"/>
  <g transform="translate(300,140)">
    <circle r="40" class="cycle-node neutral"/>
    <text x="0" y="2" text-anchor="middle" class="label">1</text>
  </g>
  <g transform="translate(420,260)">
    <circle r="40" class="cycle-node risk"/>
    <text x="0" y="2" text-anchor="middle" class="label">2</text>
  </g>
  <g transform="translate(300,380)">
    <circle r="40" class="cycle-node process"/>
    <text x="0" y="2" text-anchor="middle" class="label">3</text>
  </g>
  <g transform="translate(180,260)">
    <circle r="40" class="cycle-node input"/>
    <text x="0" y="2" text-anchor="middle" class="label">4</text>
  </g>
  <text x="300" y="252" text-anchor="middle" class="label cycle-center">PMP职场实战108问 · 图解</text>
  <text x="300" y="272" text-anchor="middle" class="small">循环</text>
  
  <text x="300" y="25" text-anchor="start" class="label cycle-label">形成期</text>
  <text x="535" y="260" text-anchor="start" class="label cycle-label">震荡期</text>
  <text x="300" y="495" text-anchor="start" class="label cycle-label">规范期</text>
  <text x="65" y="260.00000000000006" text-anchor="end" class="label cycle-label">成熟期</text>
</svg>