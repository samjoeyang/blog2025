<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowConstraint" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
    <marker id="arrowUp" markerWidth="7" markerHeight="10" refX="3.5" refY="10" orient="auto">
      <polygon points="0 10, 3.5 0, 7 10" fill="#e74c3c"/>
    </marker>
    <marker id="arrowDown" markerWidth="7" markerHeight="10" refX="3.5" refY="0" orient="auto">
      <polygon points="0 0, 3.5 10, 7 0" fill="#e74c3c"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="grdNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
    <linearGradient id="grdHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#34495e"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="620" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="900" height="52" fill="url(#grdHeader)" rx="8"/>
  <rect x="0" y="30" width="900" height="22" fill="url(#grdHeader)"/>
  <text x="450" y="33" text-anchor="middle" fill="#fff" font-size="17" font-weight="bold">流程协同节点约束示意图</text>

  <!-- 副标题 -->
  <text x="450" y="72" text-anchor="middle" fill="#7f8c8d" font-size="12">每个节点的「自我保护」都在给其他节点制造限制</text>

  <!-- ===== 流程节点链条（第二行） ===== -->
  <g transform="translate(0, 85)">

    <!-- 节点之间箭头 -->
    <line x1="102" y1="30" x2="178" y2="30" stroke="#666" stroke-width="1.5" marker-end="url(#arrowRight)"/>
    <line x1="272" y1="30" x2="348" y2="30" stroke="#666" stroke-width="1.5" marker-end="url(#arrowRight)"/>
    <line x1="442" y1="30" x2="518" y2="30" stroke="#666" stroke-width="1.5" marker-end="url(#arrowRight)"/>
    <line x1="612" y1="30" x2="688" y2="30" stroke="#666" stroke-width="1.5" marker-end="url(#arrowRight)"/>
    <line x1="782" y1="30" x2="858" y2="30" stroke="#666" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <!-- 节点圆 -->
    <circle cx="80" cy="30" r="28" fill="#e8f4fd" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="34" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="bold">采购</text>

    <circle cx="250" cy="30" r="28" fill="#e8f4fd" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
    <text x="250" y="34" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="bold">生产</text>

    <circle cx="420" cy="30" r="28" fill="#e8f4fd" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
    <text x="420" y="34" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="bold">质检</text>

    <circle cx="590" cy="30" r="28" fill="#e8f4fd" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
    <text x="590" y="34" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="bold">物流</text>

    <circle cx="760" cy="30" r="28" fill="#e8f4fd" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
    <text x="760" y="34" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="bold">销售</text>

  </g>

  <!-- ===== 约束影响箭头（红色） ===== -->
  <g stroke="#e74c3c" stroke-width="1.8" stroke-dasharray="5,3">

    <!-- 采购→生产：多备库存占资金 -->
    <path d="M 110,110 L 220,140" marker-end="url(#arrowConstraint)"/>

    <!-- 生产→采购：要求提前备料 -->
    <path d="M 250,110 L 140,140" marker-end="url(#arrowConstraint)"/>

    <!-- 生产→质检：赶工期压缩质检时间 -->
    <path d="M 280,110 L 390,140" marker-end="url(#arrowConstraint)"/>

    <!-- 质检→生产：标准严格退回 -->
    <path d="M 420,110 L 310,140" marker-end="url(#arrowConstraint)"/>

    <!-- 物流→生产：仓库爆仓 -->
    <path d="M 590,110 L 480,140" marker-end="url(#arrowConstraint)"/>

    <!-- 销售→生产：过度承诺 -->
    <path d="M 730,100 L 350,140" marker-end="url(#arrowConstraint)"/>

    <!-- 财务→采购：收紧付款周期 -->
    <path d="M 420,15 L 80,115" marker-end="url(#arrowConstraint)"/>

  </g>

  <!-- ===== 约束文本标签 ===== -->
  <g font-size="10" fill="#c0392b">
    <text x="130" y="170" text-anchor="middle">多备库存占资金</text>
    <text x="185" y="130" text-anchor="middle">要求提前备料</text>
    <text x="300" y="168" text-anchor="middle">赶工期压缩质检</text>
    <text x="360" y="130" text-anchor="middle">标准严格退回</text>
    <text x="500" y="168" text-anchor="middle">仓库爆仓</text>
    <text x="650" y="160" text-anchor="middle">过度承诺</text>
    <text x="210" y="105" text-anchor="middle">收紧付款周期</text>
  </g>

  <!-- ===== 底部: 协同机制框架 ===== -->
  <g transform="translate(0, 380)">
    <rect x="0" y="0" width="900" height="240" fill="#f8f9fa" rx="0"/>
    <rect x="0" y="0" width="900" height="34" fill="#ecf0f1" rx="0"/>
    <text x="450" y="23" text-anchor="middle" fill="#2c3e50" font-size="14" font-weight="bold">六大协同保障机制</text>

    <!-- 六项机制卡片 -->
    <g transform="translate(20, 50)">
      <!-- 1. 收益共享 -->
      <rect x="0" y="0" width="135" height="75" rx="6" fill="#fff" stroke="#3498db" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="18" cy="18" r="12" fill="#3498db"/>
      <text x="18" y="22" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text>
      <text x="45" y="22" fill="#2c3e50" font-size="11" font-weight="bold">收益共享</text>
      <text x="10" y="40" fill="#666" font-size="9.5">协同产生的增量利润</text>
      <text x="10" y="55" fill="#666" font-size="9.5">按比例分配给参与方</text>
      <text x="10" y="70" fill="#7f8c8d" font-size="8">消除「有人沾光没人出工」</text>

      <!-- 2. 仲裁机制 -->
      <rect x="150" y="0" width="135" height="75" rx="6" fill="#fff" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="168" cy="18" r="12" fill="#e67e22"/>
      <text x="168" y="22" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2</text>
      <text x="195" y="22" fill="#2c3e50" font-size="11" font-weight="bold">跨流程仲裁</text>
      <text x="160" y="40" fill="#666" font-size="9.5">管理层级介入</text>
      <text x="160" y="55" fill="#666" font-size="9.5">最终资源调配权</text>
      <text x="160" y="70" fill="#7f8c8d" font-size="8">避免「矛盾双方自己谈」</text>

      <!-- 3. RACI -->
      <rect x="300" y="0" width="135" height="75" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="318" cy="18" r="12" fill="#27ae60"/>
      <text x="318" y="22" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">3</text>
      <text x="345" y="22" fill="#2c3e50" font-size="11" font-weight="bold">RACI 权责</text>
      <text x="310" y="40" fill="#666" font-size="9.5">明确谁执行/谁拍板</text>
      <text x="310" y="55" fill="#666" font-size="9.5">谁咨询/谁知情</text>
      <text x="310" y="70" fill="#7f8c8d" font-size="8">同一结果只有一人担责</text>

      <!-- 4. 端到端负责人 -->
      <rect x="450" y="0" width="135" height="75" rx="6" fill="#fff" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="468" cy="18" r="12" fill="#8e44ad"/>
      <text x="468" y="22" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">4</text>
      <text x="495" y="22" fill="#2c3e50" font-size="11" font-weight="bold">端到端负责人</text>
      <text x="460" y="40" fill="#666" font-size="9.5">对整条流程结果负责</text>
      <text x="460" y="55" fill="#666" font-size="9.5">而非单个节点</text>
      <text x="460" y="70" fill="#7f8c8d" font-size="8">亚马逊「单向门」思维</text>

      <!-- 5. 压力预警 -->
      <rect x="600" y="0" width="135" height="75" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="618" cy="18" r="12" fill="#c0392b"/>
      <text x="618" y="22" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">5</text>
      <text x="645" y="22" fill="#2c3e50" font-size="11" font-weight="bold">节点压力预警</text>
      <text x="610" y="40" fill="#666" font-size="9.5">事前预警而非事后救火</text>
      <text x="610" y="55" fill="#666" font-size="9.5">连续高压需流程重构</text>
      <text x="610" y="70" fill="#7f8c8d" font-size="8">指数级复杂监控</text>

      <!-- 6. 文化机制 -->
      <rect x="750" y="0" width="130" height="75" rx="6" fill="#fff" stroke="#16a085" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="768" cy="18" r="12" fill="#16a085"/>
      <text x="768" y="22" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">6</text>
      <text x="795" y="22" fill="#2c3e50" font-size="11" font-weight="bold">共同目标</text>
      <text x="760" y="40" fill="#666" font-size="9.5">跨部门轮岗</text>
      <text x="760" y="55" fill="#666" font-size="9.5">OKR 全员透明</text>
      <text x="760" y="70" fill="#7f8c8d" font-size="8">「同一条船」文化</text>
    </g>

    <!-- 底部引用 -->
    <text x="450" y="220" text-anchor="middle" fill="#7f8c8d" font-size="10" font-style="italic">多元化不是摊大饼，而是织网。网靠的是一套扎实的协同机制。</text>
  </g>

</svg>
